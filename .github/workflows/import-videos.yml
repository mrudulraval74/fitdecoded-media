name: Import exercise videos from Google Drive

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Google Drive folder URL (shared: anyone with the link)"
        default: "https://drive.google.com/drive/folders/1_-fFmUfxmhTiV-qo2g1WxwuOVI9r_e1t"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown

      - name: Download Drive folder
        run: |
          gdown --folder "${{ inputs.folder }}" -O raw --remaining-ok || echo "gdown exited non-zero; continuing with what downloaded"
          echo "Downloaded: $(find raw -type f | wc -l) files, $(du -sh raw | cut -f1)"

      - name: Compress and publish as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/import_videos.py raw out

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add library/videos.json
          git commit -m "Add exercise video index (library/videos.json)" || exit 0
          git pull --rebase origin main && git push origin main
